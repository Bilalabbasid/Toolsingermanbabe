services:
  # CoolWave Main Application
  coolwave:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coolwave_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_ENABLE_ACCOUNTS=${NEXT_PUBLIC_ENABLE_ACCOUNTS:-false}
      - NEXT_PUBLIC_ENABLE_STRIPE=${NEXT_PUBLIC_ENABLE_STRIPE:-false}
      - NEXT_PUBLIC_ENABLE_BUSINESS_TIER=${NEXT_PUBLIC_ENABLE_BUSINESS_TIER:-false}
      - NEXT_PUBLIC_ENABLE_HISTORY=${NEXT_PUBLIC_ENABLE_HISTORY:-false}
      - DATABASE_URL=${DATABASE_URL:-}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set to a random value of at least 32 characters}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID_PRO_MONTHLY=${STRIPE_PRICE_ID_PRO_MONTHLY:-}
      - STRIPE_PRICE_ID_PRO_YEARLY=${STRIPE_PRICE_ID_PRO_YEARLY:-}
      - REDIS_URL=${REDIS_URL:-}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3

  # Local Development PostgreSQL (For testing; Azure PostgreSQL Flexible Server used in production)
  postgres:
    profiles: ['accounts']
    image: postgres:16-alpine
    container_name: coolwave_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coolwave_db}
      POSTGRES_USER: ${POSTGRES_USER:-coolwave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coolwave_secure_pass}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coolwave_user -d coolwave_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Queue / Rate-limiting Cache
  redis:
    profiles: ['distributed']
    image: redis:7-alpine
    container_name: coolwave_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
